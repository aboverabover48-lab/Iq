const T=20*60, PRICE="11 999", CARD="9860 1201 1408 2486";
const $=s=>document.getElementById(s), app=$("app");
window.alert=m=>{const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let db=null,user={},qs=[],cur=0,ans=[],left=T,tm=null,oid=null;
try{oid=localStorage.getItem("oid")}catch(e){}
db=true;

function welcome(){app.dataset.s="w";app.innerHTML=`
<h1>🧠 IQ Test</h1><p>Xush kelibsiz! 15 ta savol · 20 daqiqa · osondan qiyinga.</p>
<div class="card"><h2>Ma'lumotlaringiz</h2><input id="n" placeholder="Ism va familiya"><input id="y" type="number" inputmode="numeric" placeholder="Yoshingiz">
<button class="btn" onclick="start()">Testni boshlash</button></div>
<p class="small">Bu test ko'ngilochar va o'z-o'zini sinash uchun; rasmiy psixologik tashxis emas.</p>`}
function start(){const n=$("n").value.trim(),y=+$("y").value;if(n.length<3||!(y>5&&y<100))return alert("Ism-familiya va yoshingizni to'g'ri kiriting");
user={name:n,age:y};qs=[];Q.forEach((L,i)=>sh(L).slice(0,3).forEach(q=>qs.push({lv:i+1,c:q[0],t:q[1],o:sh(q[2].split("|")),a:q[2].split("|")[0]})));
cur=0;ans=[];left=T;tm=setInterval(()=>{left--;const e=$("tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000);show()}
const fmt=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function show(){app.dataset.s="q";const q=qs[cur];app.innerHTML=`<div class="top"><span>Savol ${cur+1}/15</span><span>⏱ <b id="tm">${fmt(left)}</b></span></div>
<div class="bar"><i style="width:${cur/15*100}%"></i></div>
<div class="card"><p class="small">Daraja: ${"★".repeat(q.lv)}</p><h2 style="font-size:20px;line-height:1.4;color:var(--t)">${q.t}</h2>
${q.o.map((o,i)=>`<button class="opt ${ans[cur]===o?"on":""}" onclick="pick(${i})">${o}</button>`).join("")}</div>
<button class="btn" onclick="next()">${cur==14?"Yakunlash":"Keyingisi →"}</button>`}
function pick(i){ans[cur]=qs[cur].o[i];show()}
function next(){if(cur==14)finish();else{cur++;show()}}
function calc(){let raw=0,mx=0,cs={};for(const k in CN)cs[k]={g:0,m:0};
qs.forEach((q,i)=>{mx+=q.lv;cs[q.c].m+=q.lv;if(ans[i]===q.a){raw+=q.lv;cs[q.c].g+=q.lv}});
const f=raw/mx,iq=Math.round(70+64*f),cat={};for(const k in cs)cat[k]=cs[k].m?Math.round(cs[k].g/cs[k].m*100):0;
const right=qs.filter((q,i)=>ans[i]===q.a).length;return{iq,cat,right}}
const lvl=i=>i>=130?"Juda yuqori":i>=115?"Yuqori":i>=100?"O'rtadan yuqori":i>=85?"O'rta":"O'rtadan past";
function finish(){clearInterval(tm);const r=calc();user.res=r;
oid="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{localStorage.setItem("oid",oid)}catch(e){}
app.dataset.s="p";app.innerHTML=`<h1>✅ Test yakunlandi!</h1><div class="card"><p>Natijangiz tayyor: <b style="color:#fff">${user.name}</b>, IQ darajangiz va sertifikatingiz hisoblab bo'ldi.</p>
<p>Natija va chiroyli <b style="color:#fff">sertifikat</b>ni ko'rish uchun to'lovni amalga oshiring.</p>
<div class="big" style="filter:blur(10px)">🔒 ${r.iq}</div>
<div class="price" style="text-align:center">${PRICE} so'm</div></div>
<div class="card"><h2>💳 To'lov</h2><p>Quyidagi karta raqamiga <b style="color:#fff">${PRICE} so'm</b> o'tkazing:</p>
<div class="card-n">${CARD}</div><p class="small">Karta raqamini bosib nusxa oling.</p>
<h2 style="margin-top:16px">🧾 Chekni yuklang</h2><input type="file" id="f" accept="image/*">
<button class="btn g" id="sb" onclick="send()">Chekni yuborish</button></div>`}
function compress(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=800,s=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.6,d=c.toDataURL("image/jpeg",q);while(d.length>190000&&q>.2){q-=.1;d=c.toDataURL("image/jpeg",q)}ok(d)};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
async function send(){const f=$("f").files[0];if(!f)return alert("Avval chek rasmini tanlang");
if(!db)return alert("Aloqa o'rnatilmadi. Sahifani yangilab qayta urinib ko'ring.");
$("sb").textContent="Yuborilmoqda...";try{const img=await compress(f);
const rs=await fetch("/api/submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:oid,name:user.name,age:user.age,iq:user.res.iq,right:user.res.right,cat:user.res.cat,img})});if(!rs.ok)throw 0;wait()}catch(e){alert("Yuborib bo'lmadi, qayta urining");$("sb").textContent="Chekni yuborish"}}
function wait(){app.dataset.s="wait";app.innerHTML=`<div class="card" style="text-align:center"><div class="big">⏳</div><h2>Chekingiz qabul qilindi</h2><p>To'lov tekshirilmoqda. Tasdiqlangach IQ natijangiz va sertifikat shu yerda paydo bo'ladi. Sahifani yopmang yoki keyinroq qayta kiring.</p></div>`;watch()}
let un=null;
function watch(){if(!oid)return;un&&un();const iv=setInterval(async()=>{try{const d=await (await fetch("/api/status?id="+oid)).json();if(d.status==="approved")cert(d)}catch(e){}},4000);un=()=>clearInterval(iv)}
function cert(d){un&&un();app.dataset.s="c";const c=document.createElement("canvas");c.width=900;c.height=1200;const x=c.getContext("2d");
let g=x.createLinearGradient(0,0,900,1200);g.addColorStop(0,"#fffaf0");g.addColorStop(1,"#f3ecff");x.fillStyle=g;x.fillRect(0,0,900,1200);
x.strokeStyle="#c9a227";x.lineWidth=14;x.strokeRect(30,30,840,1140);x.lineWidth=3;x.strokeRect(55,55,790,1090);
x.textAlign="center";x.fillStyle="#1b1f3b";x.font="bold 54px Georgia,serif";x.fillText("SERTIFIKAT",450,170);
x.fillStyle="#c9a227";x.font="30px Georgia,serif";x.fillText("★ ★ ★ ★ ★",450,225);
x.fillStyle="#555";x.font="26px Georgia,serif";x.fillText("Ushbu sertifikat egasi",450,300);
x.fillStyle="#7c5cff";x.font="bold 52px Georgia,serif";let nm=d.name,fs=52;while(x.measureText(nm).width>700){fs-=2;x.font=`bold ${fs}px Georgia,serif`}x.fillText(nm,450,380);
x.fillStyle="#555";x.font="26px Georgia,serif";x.fillText(d.age+" yosh",450,425);x.fillText("IQ testi natijasi:",450,500);
x.fillStyle="#1b1f3b";x.font="bold 190px Georgia,serif";x.fillText(d.iq,450,690);
x.fillStyle="#c9a227";x.font="bold 38px Georgia,serif";x.fillText("Daraja: "+lvl(d.iq),450,760);
x.fillStyle="#555";x.font="24px Georgia,serif";x.fillText(`To'g'ri javoblar: ${d.right}/15`,450,810);
let y=870;for(const k in CN){x.textAlign="left";x.fillStyle="#333";x.font="22px Georgia,serif";x.fillText(CN[k],150,y);x.fillStyle="#e4defa";x.fillRect(450,y-18,260,18);x.fillStyle="#7c5cff";x.fillRect(450,y-18,260*d.cat[k]/100,18);x.fillStyle="#333";x.fillText(d.cat[k]+"%",725,y);y+=48}
x.textAlign="center";x.fillStyle="#777";x.font="20px Georgia,serif";x.fillText("Sana: "+new Date(d.ts).toLocaleDateString("uz-UZ"),450,1090);
x.font="16px Georgia,serif";x.fillText("Ko'ngilochar test natijasi — rasmiy psixologik tashxis emas",450,1125);
app.innerHTML=`<h1>🎉 Tabriklaymiz, ${d.name}!</h1><div class="card"><div class="big">${d.iq}</div><p style="text-align:center">Daraja: <b style="color:#fff">${lvl(d.iq)}</b></p></div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function act(ids){await fetch("/api/admin",{method:"POST",headers:{"x-pass":window.AP,"content-type":"application/json"},body:JSON.stringify({ids})});load()}
